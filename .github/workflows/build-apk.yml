name: Build Android APK

# Builds an installable APK on every push and on demand, then publishes it as a
# downloadable artifact of the run.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner ships with ~14 GB free; Flutter + Android SDK + Gradle needs
      # more, so drop toolchains this build never touches.
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "After:"; df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Non-blocking: reports issues without failing the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      # One universal APK only — building per-ABI as well doubles the disk cost.
      - name: Build release APK
        run: flutter build apk --release

      - name: Disk usage after build
        if: always()
        run: df -h /

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: easy-to-find-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
